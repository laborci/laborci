<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prezentáció</title>

  <script type="module">
    import { marked } from "https://cdn.jsdelivr.net/npm/marked@15/+esm";
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/+esm";

    const deck = document.querySelector("#deck");
    const counter = document.querySelector("#counter");
    let slides = [];
    let active = 0;

    mermaid.initialize({
      startOnLoad: false,
      theme: "dark",
      securityLevel: "loose",
    });

    function show(index) {
      active = Math.max(0, Math.min(index, slides.length - 1));
      slides.forEach((slide, i) => {
        slide.classList.toggle("active", i === active);
      });
      counter.textContent = `${active + 1} / ${slides.length}`;
      history.replaceState(null, "", `#${active + 1}`);
    }

    function next() {
      show(active + 1);
    }

    function previous() {
      show(active - 1);
    }

    async function render() {
      const response = await fetch("./presentation.md");
      if (!response.ok) throw new Error("A presentation.md nem tölthető be.");

      let markdown = await response.text();

      markdown = markdown.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, "");

      const chunks = markdown
        .split(/\r?\n---\r?\n/g)
        .map((chunk) => chunk.trim())
        .filter(Boolean);

      deck.innerHTML = chunks
        .map(
          (chunk, index) => `
            <section class="slide${index === 0 ? " active" : ""}">
              <div class="content">${marked.parse(chunk)}</div>
            </section>
          `,
        )
        .join("");

      document.querySelectorAll("pre code.language-mermaid").forEach((code) => {
        const diagram = document.createElement("div");
        diagram.className = "mermaid";
        diagram.textContent = code.textContent;
        code.parentElement.replaceWith(diagram);
      });

      await mermaid.run({ nodes: document.querySelectorAll(".mermaid") });

      slides = [...document.querySelectorAll(".slide")];

      const requestedSlide = Number(location.hash.slice(1));
      show(Number.isInteger(requestedSlide) && requestedSlide > 0 ? requestedSlide - 1 : 0);
    }

    document.addEventListener("keydown", (event) => {
      if (["ArrowRight", "ArrowDown", " ", "PageDown"].includes(event.key)) {
        event.preventDefault();
        next();
      }

      if (["ArrowLeft", "ArrowUp", "PageUp"].includes(event.key)) {
        event.preventDefault();
        previous();
      }

      if (event.key === "Home") show(0);
      if (event.key === "End") show(slides.length - 1);
    });

    document.querySelector("#previous").addEventListener("click", previous);
    document.querySelector("#next").addEventListener("click", next);

    render().catch((error) => {
      deck.innerHTML = `<section class="slide active"><div class="content"><h1>Hiba</h1><p>${error.message}</p></div></section>`;
    });
  </script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #08101d;
      --panel: #101c2e;
      --text: #f5f7fb;
      --muted: #a8b3c7;
      --accent: #70e1c1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 10% 5%, #17385d 0, transparent 34rem),
        radial-gradient(circle at 90% 95%, #125346 0, transparent 32rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #deck {
      height: 100vh;
      width: 100vw;
    }

    .slide {
      display: none;
      height: 100%;
      width: 100%;
      padding: clamp(2rem, 7vw, 8rem);
      align-items: center;
      justify-content: center;
    }

    .slide.active {
      display: flex;
    }

    .content {
      width: min(100%, 1200px);
      max-height: 100%;
      overflow: auto;
      font-size: clamp(1rem, 1.8vw, 1.55rem);
      line-height: 1.55;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 8rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
      margin: 0 0 1.5rem;
      max-width: 12ch;
    }

    h2 {
      color: var(--accent);
      font-size: clamp(2rem, 4.5vw, 4.5rem);
      line-height: 1;
    }

    h3 {
      color: var(--accent);
    }

    a {
      color: var(--accent);
    }

    img,
    svg,
    video,
    iframe {
      display: block;
      max-width: 100%;
      max-height: 70vh;
      margin: 2rem auto;
      border-radius: 1rem;
    }

    img {
      object-fit: contain;
    }

    iframe {
      aspect-ratio: 16 / 9;
      width: min(100%, 1100px);
      height: auto !important;
      border: 0;
      background: #000;
    }

    pre {
      padding: 1.25rem;
      overflow: auto;
      border-radius: 1rem;
      background: #07111f;
    }

    code {
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    .mermaid {
      max-width: 100%;
      padding: 1rem;
      overflow: auto;
      border-radius: 1rem;
      background: #fff;
    }

    #controls {
      position: fixed;
      right: 1.5rem;
      bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      z-index: 2;
    }

    button {
      width: 2.8rem;
      height: 2.8rem;
      border: 1px solid #ffffff2e;
      border-radius: 999px;
      background: #15243a;
      color: var(--text);
      cursor: pointer;
      font-size: 1.25rem;
    }

    button:hover {
      background: #234160;
    }

    #counter {
      min-width: 4rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <main id="deck"></main>

  <nav id="controls" aria-label="Prezentáció vezérlése">
    <button id="previous" aria-label="Előző slide">←</button>
    <span id="counter"></span>
    <button id="next" aria-label="Következő slide">→</button>
  </nav>
</body>
</html>
